name: CI
on:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the desktop sample
        run: dotnet build samples/PhotonDesktop
      - name: Edit to view on the desktop, three times, watched
        shell: bash
        timeout-minutes: 12
        run: |
          set -uo pipefail
          (
            set +e +o pipefail
            while true; do
              echo "--- sample $(date -u +%H:%M:%S) load: $(sysctl -n vm.loadavg) $(memory_pressure -Q 2>/dev/null | tail -1)"
              for pid in $(pgrep -x PhotonDesktop); do
                fp=$(footprint -p "$pid" 2>/dev/null | awk '/phys_footprint:/ {print $2, $3; exit}')
                gfx=$(footprint -p "$pid" 2>/dev/null | /usr/bin/grep -i -E 'IOAccelerator|IOSurface' | head -2 | tr -s ' ' | tr '\n' ';')
                echo "  PhotonDesktop pid $pid footprint $fp graphics: $gfx"
                mb=$(footprint -p "$pid" -f bytes 2>/dev/null | awk '/phys_footprint:/ {print int($2/1048576); exit}')
                if [ -n "$mb" ] && [ "$mb" -gt 2500 ]; then echo "WATCHDOG: PhotonDesktop (pid $pid) footprint ${mb} MB, killed"; kill -9 "$pid"; fi
              done
              sleep 5
            done
          ) &
          sampler=$!
          status=0
          for round in 1 2 3; do
            echo "::group::round $round"
            dotnet run scripts/measure-edit-to-view.cs -- desktop --runs 6 --report "$RUNNER_TEMP/round-$round.json" || status=1
            echo "::endgroup::"
          done
          kill $sampler || true
          exit $status
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.attempt }}
          path: ${{ runner.temp }}/round-*
          if-no-files-found: ignore
