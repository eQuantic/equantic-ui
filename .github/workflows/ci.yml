name: CI
on:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the desktop sample
        run: dotnet build samples/PhotonDesktop
      - name: Edit to view on the desktop, three times, watched
        shell: bash
        timeout-minutes: 12
        run: |
          set -uo pipefail
          (
            set +e +o pipefail
            while true; do
              echo "--- sample $(date -u +%H:%M:%S) load: $(sysctl -n vm.loadavg) swap: $(sysctl -n vm.swapusage) free pages: $(vm_stat | awk '/Pages free/ {print $3}')"
              ps -axo pid=,rss=,%cpu=,comm= > "$RUNNER_TEMP/ps.txt"
              sort -k2 -nr "$RUNNER_TEMP/ps.txt" > "$RUNNER_TEMP/ps-sorted.txt"
              head -6 "$RUNNER_TEMP/ps-sorted.txt" | awk '{printf "  pid %s rss %d MB cpu %s %s\n", $1, $2/1024, $3, $4}'
              awk '$2 > 3145728 {print $1, int($2/1024), $4}' "$RUNNER_TEMP/ps.txt" > "$RUNNER_TEMP/big.txt"
              while read -r pid mb name; do echo "WATCHDOG: $name (pid $pid) holds ${mb} MB, killed"; kill -9 "$pid"; done < "$RUNNER_TEMP/big.txt"
              sleep 10
            done
          ) &
          sampler=$!
          status=0
          for round in 1 2 3; do
            echo "::group::round $round"
            dotnet run scripts/measure-edit-to-view.cs -- desktop --runs 6 --report "$RUNNER_TEMP/round-$round.json" || status=1
            echo "::endgroup::"
          done
          kill $sampler || true
          exit $status
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.attempt }}
          path: ${{ runner.temp }}/round-*
          if-no-files-found: ignore
