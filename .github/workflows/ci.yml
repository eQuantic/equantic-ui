name: CI
on:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the desktop sample
        run: dotnet build samples/PhotonDesktop
      - name: Edit to view on the desktop, three times
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for round in 1 2 3; do
            echo "::group::round $round"
            dotnet run scripts/measure-edit-to-view.cs -- desktop --runs 6 --budget scripts/edit-to-view.budget.json || status=1
            echo "::endgroup::"
          done
          exit $status
