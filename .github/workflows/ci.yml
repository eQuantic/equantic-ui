name: CI

on:
  push:
    branches: ["main"]
    # `v*` is the framework's release; `ext-v*` is the extension's. The second is not a prefix of the
    # first ON PURPOSE — a tag named `vscode-v0.2.0` matched `v*` and ran the framework's packing with
    # VERSION="scode-v0.2.0". Renaming it fixed that and broke this: with only `v*` here, an `ext-v*`
    # tag triggered nothing at all.
    tags: ["v*", "ext-v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (leave empty to use Directory.Build.props)"
        required: false
        default: ""

jobs:
  # Build TypeScript Runtime once (platform-agnostic)
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Runtime TypeScript (using embedded Bun)
        shell: bash
        run: |
          # Extract Bun binary if it's still zipped
          BUN_PATH="$GITHUB_WORKSPACE/src/eQuantic.UI.Runtime.Linux64/tools/bun/bun-linux"

          if [ ! -f "$BUN_PATH" ]; then
            echo "Extracting Bun binary..."
            unzip -q "$GITHUB_WORKSPACE/src/eQuantic.UI.Runtime.Linux64/tools/bun/bun-linux.zip" \
                  -d "$GITHUB_WORKSPACE/src/eQuantic.UI.Runtime.Linux64/tools/bun/"
            chmod +x "$BUN_PATH"
          fi

          echo "Using Bun at: $BUN_PATH"
          ls -lh "$BUN_PATH"

          cd src/eQuantic.UI.Runtime
          "$BUN_PATH" install
          "$BUN_PATH" x tsc && "$BUN_PATH" x vite build

      - name: Test Runtime (vitest)
        shell: bash
        run: |
          BUN_PATH="$GITHUB_WORKSPACE/src/eQuantic.UI.Runtime.Linux64/tools/bun/bun-linux"
          cd src/eQuantic.UI.Runtime
          "$BUN_PATH" x vitest run

      - name: Upload Runtime Build
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build
          path: src/eQuantic.UI.Runtime/dist/

  # Build platform-specific runtime packages
  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          # 22, because vsce's own dependencies ask for it — on 20 npm prints an EBADENGINE wall.
          node-version: 22

      # Builds the .vsix, and then checks the two ways it can be quietly broken: a .vscodeignore that
      # leaves the design host out (the extension installs, activates, and fails on the first
      # preview), and a host that was published against a different shape of the protocol. The
      # second check SPAWNS the packaged host and speaks to it.
      - name: Package the VS Code extension
        working-directory: extensions/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run package

      - name: Upload the extension
        uses: actions/upload-artifact@v4
        with:
          name: equantic-ui-vsix
          path: extensions/vscode/equantic-ui.vsix

  build-platform-runtimes:
    needs: build-runtime
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Each OS leg packs BOTH architectures of its platform — packing only zips the right
          # Bun binary, it does not depend on the host arch. The SDK references all six.
          - os: ubuntu-latest
            runtime: Linux64
            runtime2: LinuxArm64
          - os: windows-latest
            runtime: Win64
            runtime2: WinArm64
          - os: macos-latest
            runtime: Osx64
            runtime2: OsxArm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Runtime Build
        uses: actions/download-artifact@v4
        with:
          name: runtime-build
          path: src/eQuantic.UI.Runtime/dist/

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # A release tag IS the version: v0.2.0-preview.1 -> 0.2.0-preview.1
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Read version from Directory.Build.props (single source of truth)
            VERSION=$(grep -o '<Version>[^<]*</Version>' Directory.Build.props | sed 's/<Version>//;s/<\/Version>//')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from Directory.Build.props: $VERSION"
          fi

      - name: Build and Pack Runtime.${{ matrix.runtime }} + ${{ matrix.runtime2 }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          dotnet pack src/eQuantic.UI.Runtime.${{ matrix.runtime }}/eQuantic.UI.Runtime.${{ matrix.runtime }}.csproj -c Release -p:Version=$VERSION
          dotnet pack src/eQuantic.UI.Runtime.${{ matrix.runtime2 }}/eQuantic.UI.Runtime.${{ matrix.runtime2 }}.csproj -c Release -p:Version=$VERSION

      - name: Upload Runtime.${{ matrix.runtime }} + ${{ matrix.runtime2 }} Packages
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.runtime }}-package
          path: |
            src/eQuantic.UI.Runtime.${{ matrix.runtime }}/bin/Release/*.nupkg
            src/eQuantic.UI.Runtime.${{ matrix.runtime2 }}/bin/Release/*.nupkg

  # Build core packages (platform-agnostic)
  build-packages:
    needs: build-platform-runtimes
    # macOS: the package set includes the iOS/Android shells, whose target frameworks need
    # platform workloads that only install on a Mac (and the full native test suite runs here
    # instead of skipping its Apple-framework facts).
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Runtime Build
        uses: actions/download-artifact@v4
        with:
          name: runtime-build
          path: src/eQuantic.UI.Runtime/dist/

      - name: Install mobile workloads (iOS/Android shells)
        run: dotnet workload install ios android

      - name: Download Platform Runtime Packages
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*-package
          path: .local-packages/
          merge-multiple: true

      - name: Create artifacts directory for NuGet
        run: |
          mkdir -p artifacts/packages
          # Copy platform runtime packages to artifacts for NuGet resolution. find, not a glob:
          # multi-path artifact uploads preserve their directory structure on download.
          find .local-packages -name "*.nupkg" -exec cp {} artifacts/packages/ \;

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # A release tag IS the version: v0.2.0-preview.1 -> 0.2.0-preview.1
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Read version from Directory.Build.props (single source of truth)
            VERSION=$(grep -o '<Version>[^<]*</Version>' Directory.Build.props | sed 's/<Version>//;s/<\/Version>//')
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from Directory.Build.props: $VERSION"
          fi

      - name: Build and Pack All Packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # The package set is DISCOVERED, not listed: every project under src/ that says
          # IsPackable (the csproj is the one place that decision already lives) is built and
          # packed here. The hand-kept roster this replaces missed eQuantic.UI.Email for two
          # releases — it never reached nuget.org while the release notes announced it. Tools
          # that ride inside the SDK packages (eQuantic.Build, eQuantic.UI.Native.Build) and
          # design-time projects say IsPackable=false themselves. Left out on purpose: the
          # per-RID runtime packs (the platform matrix packs them) and the four projects below,
          # whose pack targets stage tools and must not run with --no-build.
          SEPARATE="eQuantic.UI.Runtime eQuantic.UI.Sdk eQuantic.UI.Sdk.Native eQuantic.UI.Templates"
          PACKED=0
          for csproj in src/*/*.csproj; do
            name=$(basename "$(dirname "$csproj")")
            case " $SEPARATE " in *" $name "*) continue;; esac
            case "$name" in eQuantic.UI.Runtime.*) continue;; esac
            packable=$(dotnet msbuild "$csproj" -getProperty:IsPackable -nologo 2>/dev/null | tr -d '[:space:]')
            if [ "${packable,,}" = "false" ]; then continue; fi
            echo "::group::pack $name"
            dotnet build "$csproj" -c Release -p:Version=$VERSION
            dotnet pack  "$csproj" -c Release --no-build -p:Version=$VERSION
            echo "::endgroup::"
            PACKED=$((PACKED + 1))
          done
          echo "::notice::packed $PACKED discovered packages"
          # A discovery that finds nothing is a broken discovery, not an empty repository.
          [ "$PACKED" -ge 30 ] || { echo "::error::only $PACKED packable projects found under src/"; exit 1; }

          # The Runtime meta-package and the SDKs pack WITHOUT --no-build: their pack targets
          # stage tools (eqc, eQuantic.Build, eqicon) and stamp versions.
          dotnet pack src/eQuantic.UI.Runtime/eQuantic.UI.Runtime.csproj -c Release -p:Version=$VERSION
          dotnet pack src/eQuantic.UI.Sdk/eQuantic.UI.Sdk.csproj -c Release -p:Version=$VERSION
          dotnet pack src/eQuantic.UI.Sdk.Native/eQuantic.UI.Sdk.Native.csproj -c Release -p:Version=$VERSION
          dotnet pack src/eQuantic.UI.Templates/eQuantic.UI.Templates.csproj -c Release -p:Version=$VERSION

      # The wiki is a SEPARATE repository, and the version-mark guard reads it from beside this
      # one. Without this the guard passes here having checked nothing, and a wrong "Since
      # 0.2.0-preview.N" reaches the site — which mirrors the wiki — unchallenged.
      # The version-mark guard asks `git tag --contains`, and a shallow checkout has no tags: it
      # would answer "unreleased" for everything and pass having checked nothing.
      - name: Fetch tags (for the version-mark guard)
        shell: bash
        run: git fetch --tags --force --depth=1 origin

      - name: Check out the wiki (for the docs guards)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/eQuantic/equantic-ui.wiki.git ../equantic-ui.wiki

      - name: Test
        shell: bash
        env:
          # Conformance must FAIL (not skip) if no JS engine works on the runner.
          EQ_REQUIRE_JS: "1"
        run: |
          set -euo pipefail
          # find, not globstar: macOS ships bash 3.2, which has no globstar.
          find tests -name "*.csproj" | while read -r test_project; do
            echo "Testing $test_project..."
            dotnet test "$test_project" --configuration Release --verbosity normal
          done

      - name: Collect All NuGet Packages
        shell: bash
        run: |
          mkdir -p nupkgs
          # Copy platform runtime packages (find: the artifact keeps its directory structure)
          find .local-packages -name "*.nupkg" -exec cp {} nupkgs/ \;
          # Copy core packages
          find src -name "*.nupkg" -path "*/bin/Release/*" -exec cp {} nupkgs/ \;

      - name: Upload All NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/*.nupkg


  # GitHub Packages is a convenience feed for every main push — a light ubuntu job so the heavy
  # macOS build job never dies on the upload (exit 137).
  publish-github:
    needs: [build-packages, gate-templates]
    # On a TAG this waits for the gate, as nuget.org already does. It did not, so a release whose
    # templates failed to scaffold still landed here: preview.31 sat on this feed carrying a broken
    # template while the public feed correctly never got it, and the two had to be reconciled by
    # hand. A feed that can disagree with the other one is worse than a slow feed.
    #
    # On an ordinary main push the gate does not run at all (it is tag-only) and this must still
    # publish — a SKIPPED dependency skips the job under the default rule, which is why the results
    # are named one by one instead. `always()` reaches this condition even when a need was skipped;
    # build-packages is then required explicitly, because always() would otherwise publish the
    # packages a failed build never produced.
    if: |
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.build-packages.result == 'success'
      && (needs.gate-templates.result == 'success' || needs.gate-templates.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/

      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in nupkgs/*.nupkg; do
            echo "Publishing $package to GitHub Packages..."
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/eQuantic/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done

  # Release gate — runs ONLY on a v* tag: on every desktop OS, a fresh consumer must be able to
  # scaffold and BUILD (and on the web template, PUBLISH) against the exact packages being
  # released. The native template gates on macOS only (its icon pipeline needs CoreGraphics).
  gate-templates:
    needs: build-packages
    # `refs/tags/v` matches by PREFIX, so any tag beginning with v enters here — the extension's
    # releases are tagged `ext-v*` for exactly that reason.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/

      - name: Gate — templates against the release feed
        shell: bash
        run: |
          set -euo pipefail
          FEED="$PWD/nupkgs"
          # git-bash reports POSIX paths; NuGet on Windows needs the native form.
          if [ "$RUNNER_OS" = "Windows" ]; then FEED="$(cygpath -w "$FEED")"; fi

          mkdir -p gate && cd gate
          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<configuration>' \
            '  <packageSources>' \
            '    <clear />' \
            "    <add key=\"release-feed\" value=\"$FEED\" />" \
            '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />' \
            '  </packageSources>' \
            '</configuration>' > nuget.config

          dotnet new install "$FEED"/eQuantic.UI.Templates.*.nupkg

          # WHICH shapes to gate is asked of the template, never kept in a list here. Only the
          # default shell was ever built, so `--shell dashboard` and `--shell topnav` — and all four
          # native shapes — reached strangers having been compiled by nobody. A list in this file
          # would be one more thing for the author of a new shell to remember, in the file they are
          # least likely to open; the `--shell <a|b|c>` line is what a user reads anyway.
          shells() {
            dotnet new "$1" --help | grep -oE -- '--shell <[^>]+>' | head -1 \
              | sed -E 's/.*<([^>]+)>.*/\1/' | tr '|' ' '
          }

          WEB_SHELLS="$(shells equantic-app)"
          # A gate that walks nothing passes for the wrong reason, and would go on passing.
          test -n "$WEB_SHELLS"
          echo "Web shapes: $WEB_SHELLS"

          for shape in $WEB_SHELLS; do
            # Dashes are legal in a project name and not in a namespace — the shape names them.
            name="GateWeb$(echo "$shape" | tr -d '-')"
            dotnet new equantic-app -n "$name" --shell "$shape"
            (cd "$name" && cp ../nuget.config . && dotnet build -c Release)
          done

          # PUBLISH once, on the first shape: the runtime lands through one target for every shell,
          # so publishing each of them buys the same assertion three times over.
          FIRST="GateWeb$(echo "$WEB_SHELLS" | awk '{print $1}' | tr -d '-')"
          (cd "$FIRST" && dotnet publish -c Release -o publish)
          test -f "$FIRST"/publish/wwwroot/_equantic/runtime.js

          if [ "$RUNNER_OS" = "macOS" ]; then
            NATIVE_SHELLS="$(shells equantic-native)"
            test -n "$NATIVE_SHELLS"
            echo "Native shapes: $NATIVE_SHELLS"

            for shape in $NATIVE_SHELLS; do
              name="GateNative$(echo "$shape" | tr -d '-')"
              dotnet new equantic-native -n "$name" --shell "$shape"
              (cd "$name" && cp ../nuget.config . && dotnet build -c Release)
            done
          fi

          echo "Template gate green on $RUNNER_OS."

  publish-extension:
    needs: package-extension
    # A tag of its own — and one that cannot be MISTAKEN for a framework tag. The release jobs below
    # fire on `refs/tags/v`, which `vscode-v0.2.0` also starts with: that tag ran the framework's
    # packing with VERSION="scode-v0.2.0" and failed restore on a version that is not one. `ext-v*`
    # shares no prefix with `v*`.
    if: startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Read as job-level env so the steps can BRANCH on which credential exists — a secret cannot be
      # tested directly in a step's `if`.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The SAME archive the packaging job built and verified, not a rebuild of it. A rebuild is a
      # different artifact, and the one that was checked would not be the one that shipped.
      - name: Download the extension
        uses: actions/download-artifact@v4
        with:
          name: equantic-ui-vsix

      # The tag and the manifest have to agree, or the job publishes a version nobody tagged — and the
      # Marketplace refuses a version that already exists, which is how a release "fails at the end"
      # for a reason decided at the beginning. Read out of the ARCHIVE, since that is what ships.
      - name: The tag names the version being published
        shell: bash
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#ext-v}"
          packaged="$(unzip -p equantic-ui.vsix extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::the tag says $tagged and the package says $packaged."
            exit 1
          fi
          echo "publishing $packaged"

      # Microsoft Entra, when it is configured. `vsce publish --azure-credential` acquires its token
      # through the Azure CLI, so something has to log that CLI in first — on GitHub Actions that is
      # this action with workload identity federation, and no secret is stored.
      - name: Sign in to Azure
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the Marketplace
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${AZURE_CLIENT_ID:-}" ]; then
            npx @vscode/vsce@^3.9.2 publish --packagePath equantic-ui.vsix --azure-credential
          elif [ -n "${VSCE_PAT:-}" ]; then
            # Retires 2026-12-01. Kept because it is the only path that needs nothing but a secret.
            npx @vscode/vsce@^3.9.2 publish --packagePath equantic-ui.vsix
          else
            echo "::error::No Marketplace credential. Set VSCE_PAT, or AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID for Entra."
            echo "::error::(vsce 3.9.2 has no --oidc; trusted publishing is on the tool's main branch and not released yet.)"
            exit 1
          fi

  publish-nuget:
    needs: gate-templates
    # `refs/tags/v` matches by PREFIX, so any tag beginning with v enters here — the extension's
    # releases are tagged `ext-v*` for exactly that reason.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: nupkgs/

      - name: Publish to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not configured."
            exit 1
          fi
          for package in nupkgs/*.nupkg; do
            echo "Publishing $package to nuget.org..."
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
