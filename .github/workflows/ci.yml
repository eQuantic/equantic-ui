name: CI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [watch, plain]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the desktop sample
        run: dotnet build samples/PhotonDesktop
      - name: Edit to view on the desktop, shipped live
        shell: bash
        timeout-minutes: 10
        env:
          EQ_EDIT_TO_VIEW_ECHO: "1"
          LOG_BRANCH: test/desktop-edit-log-${{ github.run_id }}-${{ matrix.mode }}-${{ matrix.attempt }}
        run: |
          set -uo pipefail
          live="$RUNNER_TEMP/live.log"
          : > "$live"
          ship="$RUNNER_TEMP/ship"
          git worktree add -q --detach "$ship"
          ( cd "$ship" && git checkout -q --orphan "$LOG_BRANCH" && git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + )
          git -C "$ship" config user.name ci; git -C "$ship" config user.email ci@localhost
          (
            set +e +o pipefail
            while true; do
              {
                echo "--- sample $(date -u +%H:%M:%S) load: $(sysctl -n vm.loadavg) $(memory_pressure -Q 2>/dev/null | tail -1)"
                pgrep -lf 'PhotonDesktop|WindowServer' | cut -c1-120
                ps -axo pid=,%cpu=,rss=,comm= | sort -k2 -nr | head -5
              } >> "$live"
              cp "$live" "$ship/live.log"
              git -C "$ship" add live.log && git -C "$ship" commit -qm "log $(date -u +%H:%M:%S)" && git -C "$ship" push -q origin "HEAD:refs/heads/$LOG_BRANCH" 2>/dev/null
              sleep 15
            done
          ) &
          shipper=$!
          status=0
          if [ "${{ matrix.mode }}" = "plain" ]; then
            echo "=== plain run $(date -u +%H:%M:%S)" | tee -a "$live"
            dotnet run --no-build --project samples/PhotonDesktop >> "$live" 2>&1 &
            app=$!
            for t in $(seq 1 18); do sleep 10; echo "=== alive $(date -u +%H:%M:%S) app running: $(pgrep -x PhotonDesktop | head -1)" | tee -a "$live"; done
            kill $app || true; pkill -x PhotonDesktop || true
          else
            for round in 1 2 3; do
              echo "=== round $round $(date -u +%H:%M:%S)" | tee -a "$live"
              dotnet run scripts/measure-edit-to-view.cs -- desktop --runs 6 2>&1 | tee -a "$live" || status=1
            done
          fi
          kill $shipper || true
          exit $status
