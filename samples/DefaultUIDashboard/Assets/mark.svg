<?xml version="1.0" encoding="UTF-8"?>
<!-- A mark with the four cases that matter: a gradient, a literal colour, a group transform,
     and a shape that asks to be tinted by whatever holds it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="bead" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="240" height="80" rx="16" fill="url(#plate)"/>
  <g transform="translate(24 16) scale(1.5)">
    <circle cx="16" cy="16" r="16" fill="url(#bead)"/>
    <path d="M8 16 L14 22 L24 10" stroke="#E0E7FF" stroke-width="3" fill="none"/>
  </g>
  <path d="M112 30h96v8h-96z" fill="currentColor"/>
  <path d="M112 46h64v6h-64z" fill="currentColor" fill-opacity="0.55"/>
</svg>
