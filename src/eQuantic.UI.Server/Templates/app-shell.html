<!doctype html>
<html lang="{{HtmlLang}}" class="{{HtmlClass}}">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{Title}}</title>
        {{MetadataTags}}

        <!-- Framework invariants (before app styles, so an app CAN deliberately override):
             the app root is the web mirror of the native window — a determinate frame at least
             one viewport tall whose single child (the page root) stretches to it. A page root
             asking Height=Fill gets the viewport here exactly as it gets the window on native. -->
        <style>
            /* Exact height, not min: an APP page (root Height=Fill → height:100%) resolves to
               exactly one viewport and scrolls INTERNALLY; a DOCUMENT page (auto-height root)
               overflows this frame visibly and the body scrolls, as it always did. The child
               min-height:0 is what lets an app page's root obey its 100% instead of its content. */
            #app { height: 100vh; height: 100dvh; display: grid; }
            #app > * { min-height: 0; }
        </style>
        {{?BaseStyles}}
        <style>
            {{BaseStyles}}
        </style>
        {{/BaseStyles}} {{HeadTags}}

        <!-- Import Map for bare modules -->
        <script type="importmap">
            {
                "imports": {
                    "@equantic/runtime": "/_equantic/runtime.js?v={{BuildId}}"
                }
            }
        </script>

        {{#if HasServerActions}}
        <!-- SignalR (for Server Actions RPC) -->
        {{#if IsDevelopment}}
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.js"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        {{#else}}
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"
            integrity="sha512-7rhBJh1om/W5Ztx7WiYOR9h2wlSaTmPyQMoHFtbT/FVNIA12y6S6I8HY9mrBS1uJ3dSU/R3qaSAXsGYuRjMDxg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        {{/if}} {{/if}} {{#if IsDevelopment}}
        <!-- Development Mode -->
        <script>
            console.log('[eQuantic.UI] Running in DEVELOPMENT mode');
            console.log('[eQuantic.UI] BuildId:', '{{BuildId}}');
            console.log('[eQuantic.UI] SSR:', {{SsrEnabled}});
            {{#if HasServerActions}}
            console.log('[eQuantic.UI] Server Actions: ENABLED');
            {{/if}}
        </script>
        {{/if}}
    </head>
    <body>
        <div id="app" data-ssr="{{SsrEnabled}}">{{SsrContent}}</div>

        <!-- eQuantic.UI Runtime (Static Asset) -->
        <script>
            window.__EQ_CONFIG = {{ConfigJson}};
            window.__EQ_DEV__ = {{IsDevelopmentBool}};
            {{?ThemeData}}{{ThemeData}}{{/ThemeData}}
            {{?CultureData}}{{CultureData}}{{/CultureData}}
            {{?InitialState}}{{InitialState}}{{/InitialState}}
        </script>
        <script type="module">
            import { boot } from "@equantic/runtime";
            boot();
        </script>

        {{#if IsDevelopment}}
        <!-- Development Tools -->
        <script>
            // Add development helpers
            window.__EQ_DEBUG = {
                getState: () => window.__INITIAL_STATE__,
                getConfig: () => window.__EQ_CONFIG,
                reload: () => location.reload(),
            };
            console.log(
                "[eQuantic.UI] Debug helpers available: window.__EQ_DEBUG",
            );
        </script>
        {{/if}}
    </body>
</html>
